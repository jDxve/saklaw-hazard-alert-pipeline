# Deploying is a decision, not a consequence of merging.
#
# A deploy here starts scheduled scrapers hitting PAGASA and PHIVOLCS every two
# to five minutes and puts a live FCM publisher in front of four real topics.
# Nothing about that should happen because someone merged a README change, so
# this runs only when a person asks it to.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: functions
        type: choice
        options:
          - functions
          - hosting
          - firestore
          - everything

permissions:
  contents: read

env:
  # Pinned rather than floating on latest: which CLI shipped a release should
  # be a commit that changes this line, not the Tuesday it was run on.
  FIREBASE_TOOLS_VERSION: "15.28.2"
  # The functions' region, and the suffix Firebase puts on the Cloud Scheduler
  # job it creates for each scheduled function.
  FUNCTIONS_REGION: asia-southeast1

# One deploy at a time, and never cancelled halfway: interrupting an upload
# leaves half the functions on the new revision and half on the old.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Gate approvals, required reviewers and the secrets live on this
    # environment, so who may deploy is a repository setting rather than
    # something this file decides.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gates CI runs. A deploy that skips them is a deploy that can
      # ship a parser we already know is broken.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Written to a file rather than passed inline: firebase-tools reads the
      # credential from a path, and a secret on the command line lands in the
      # process list.
      - name: Authenticate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set on the production environment."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Resolve deploy target
        run: |
          case "${{ inputs.target }}" in
            functions)  echo "ONLY=functions" >> "$GITHUB_ENV" ;;
            hosting)    echo "ONLY=hosting" >> "$GITHUB_ENV" ;;
            firestore)  echo "ONLY=firestore:rules,firestore:indexes" >> "$GITHUB_ENV" ;;
            everything) echo "ONLY=functions,hosting,firestore:rules,firestore:indexes" >> "$GITHUB_ENV" ;;
          esac

      # `defineSecret` makes NOAH_WEBHOOK_SECRET a deploy-time requirement, not
      # a runtime one: firebase refuses to deploy a function referencing a
      # secret that does not exist, and --non-interactive cannot stop to ask.
      # So a first deploy from CI would fail here rather than at the webhook.
      #
      # Seeded from a GitHub secret only when Secret Manager has nothing. An
      # existing value is never overwritten — rotating is a deliberate act
      # (`firebase functions:secrets:set`), not a side effect of deploying.
      - name: Ensure the webhook secret exists
        if: inputs.target == 'functions' || inputs.target == 'everything'
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          WEBHOOK_SECRET: ${{ secrets.NOAH_WEBHOOK_SECRET }}
        run: |
          cli="firebase-tools@$FIREBASE_TOOLS_VERSION"
          if npx --yes "$cli" functions:secrets:access NOAH_WEBHOOK_SECRET \
               --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "NOAH_WEBHOOK_SECRET is already set; leaving it alone."
            exit 0
          fi
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::NOAH_WEBHOOK_SECRET is missing from Secret Manager, and no GitHub secret of that name was given to seed it. Deploying functions would fail."
            exit 1
          fi
          printf '%s' "$WEBHOOK_SECRET" \
            | npx --yes "$cli" functions:secrets:set NOAH_WEBHOOK_SECRET \
                --project "$PROJECT_ID" --data-file -

      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::FIREBASE_PROJECT_ID variable is not set on the production environment."
            exit 1
          fi
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy \
            --project "$PROJECT_ID" \
            --only "$ONLY" \
            --non-interactive \
            --force

      # gcloud is not on the runner, and the scheduler jobs are not something
      # firebase-tools can trigger. Same credential as the deploy rather than a
      # second one to rotate; this runs after the deploy so it cannot disturb
      # the GOOGLE_APPLICATION_CREDENTIALS the firebase steps rely on.
      - name: Authenticate to Google Cloud
        if: inputs.target == 'functions' || inputs.target == 'everything'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: inputs.target == 'functions' || inputs.target == 'everything'
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Scheduler counts from when the job was created, so a freshly
      # deployed function waits for its next tick before it has ever run.
      # syncNoahGisDataset is on `0 2 * * *`: deploy at three in the afternoon
      # and nothing proves it works until two the following morning.
      #
      # Running each once turns a deploy into a smoke test. It is not a
      # meaningful increase in load on the sources: three of these four poll
      # every two to five minutes anyway, so the deploy was never inert — only
      # the daily NOAH check actually changes, and that is the one that most
      # needed proving.
      - name: Smoke-test the scheduled jobs
        if: inputs.target == 'functions' || inputs.target == 'everything'
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          failed=0
          for fn in \
            syncPhivolcsQuakes \
            syncPagasaCyclone \
            syncPagasaFlood \
            syncNoahGisDataset
          do
            job="firebase-schedule-$fn-$FUNCTIONS_REGION"
            echo "--- $job"
            # A scraper erroring is a different signal from a deploy failing,
            # and the deploy has already succeeded by this point. Each failure
            # becomes an annotation; none of them fails the run.
            if ! gcloud scheduler jobs run "$job" \
                   --location "$FUNCTIONS_REGION" \
                   --project "$PROJECT_ID" 2>&1
            then
              echo "::warning title=Scheduled job did not run::$job could not be triggered. The deploy succeeded; check the function's logs."
              failed=$((failed + 1))
            fi
          done
          echo "Triggered 4 jobs, $failed could not be started."

      # The credential is short-lived on a throwaway runner, but leaving it on
      # disk for later steps to trip over is a habit worth not having.
      - name: Revoke credential
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
