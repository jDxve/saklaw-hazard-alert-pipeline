<h1>Saklaw hazard API</h1>
<p>
  This host exists to put a CDN in front of the hazard read API. There is no
  site here.
</p>
<ul>
  <li><code>GET /api/v1/hazards</code></li>
  <li><code>GET /api/v1/hazards/{id}</code></li>
  <li><code>GET /api/v1/layers/manifest</code></li>
</ul>
<p>
  Hazard data is read from PAGASA and PHIVOLCS bulletins. It is not a
  substitute for their own warnings.
</p>
